<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2D Physics Sandbox</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="controls">
        <button id="spawn-circle">Spawn Circle</button>
        <button id="spawn-box">Spawn Box</button>
        <button id="jump-btn">Jump!</button>
        <button id="clear">Clear Canvas</button>
        <label>
            Gravity
            <input type="range" id="gravity-slider" min="0" max="2" step="0.1" value="0.5">
        </label>
        <label>
            Restitution (Bounciness)
            <input type="range" id="bounce-slider" min="0" max="1" step="0.1" value="0.7">
        </label>
    </div>
    <canvas id="canvas"></canvas>
    <script src="script.js"></script>
</body>
</html>
